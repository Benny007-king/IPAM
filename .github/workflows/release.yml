name: Windows installer

# Push a tag vX.Y.Z (matching package.json) to build, test and publish a release.
# "Run workflow" builds and tests without publishing (artifacts only).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SQLite engine present
        shell: pwsh
        run: |
          $node = 'node_modules/better-sqlite3/build/Release/better_sqlite3.node'
          if (-not (Test-Path $node)) { npm rebuild better-sqlite3 }
          if (-not (Test-Path $node)) { throw "$node was not built" }

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match package.json version $v" }

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build ipam.exe
        run: node scripts/build-exe.mjs

      - name: Build the installer
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVersion=$v" installer\ipam.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Install, use, upgrade and uninstall it
        shell: pwsh
        run: ./scripts/test-installer.ps1

      - name: Checksums
        shell: pwsh
        working-directory: release
        run: |
          Get-ChildItem IPAM-Setup-*.exe, IPAM-*-portable.zip |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content SHA256SUMS -Encoding ascii
          Get-Content SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipam-windows
          if-no-files-found: ignore
          path: |
            release/IPAM-Setup-*.exe
            release/IPAM-*-portable.zip
            release/SHA256SUMS
            release/install.log

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[?$([regex]::Escape($v))\]?[^\r\n]*\r?\n(.*?)(?=^## |\z)")
          $notes = $m.Groups[1].Value.Trim()
          $notes += "`n`n### Downloads`n- **IPAM-Setup-$v.exe** - installer: runs IPAM as a Windows service (recommended)`n- **IPAM-$v-win-x64-portable.zip** - run ipam.exe without installing`n- **SHA256SUMS** - checksums`n`nWindows may warn that the installer is from an unknown publisher (it is not code-signed): choose *More info* > *Run anyway*."
          Set-Content release/notes.md $notes -Encoding utf8
          gh release create '${{ github.ref_name }}' (Get-Item release/IPAM-Setup-*.exe).FullName (Get-Item release/IPAM-*-portable.zip).FullName release/SHA256SUMS --title "IPAM ${{ github.ref_name }}" --notes-file release/notes.md
